name: Update market data

on:
  schedule:
    # 미국 정규장 시간대(UTC 13:00~21:59, 월~금): 10분마다
    - cron: "*/10 13-21 * * 1-5"
    # 그 외 시간: 매시 정각 (환율·VIX 선물 반영)
    - cron: "7 * * * *"
  workflow_dispatch:
  # 코드가 바뀌어 올라오면 바로 한 번 실행 (data.json만 바뀐 커밋은 제외)
  push:
    branches: [main]
    paths-ignore: [data.json]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch data
        run: python3 scripts/fetch_data.py data.json
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update market data" && git push
